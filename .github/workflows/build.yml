# Сборка OpsDeck под Linux / Windows / macOS на нативных раннерах (своя ОС и архитектура,
# без кросс-компиляции). Пуш в main/master и PR — сборка + артефакты в Actions;
# тег v* (например v0.2.0) — ещё и черновик релиза со всеми установщиками.
name: build

on:
  push:
    branches: [main, master]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  checks:
    name: checks (types, audits)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: TypeScript
        run: npx tsc
      - name: npm audit (high+)
        run: npm audit --audit-level=high
      - uses: dtolnay/rust-toolchain@stable
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-audit
      - name: cargo audit (RustSec)
        working-directory: src-tauri
        run: cargo audit

  build:
    name: build ${{ matrix.name }}
    needs: checks
    permissions:
      contents: write # черновик релиза на тегах
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-x64
            os: ubuntu-22.04 # старый glibc → .deb/AppImage запускаются и на более новых дистрибутивах
          - name: linux-arm64
            os: ubuntu-22.04-arm # arm64-раннеры бесплатны для публичных репозиториев
          - name: windows-x64
            os: windows-latest
          - name: windows-arm64
            os: windows-11-arm
            experimental: true # ARM-раннер Windows пока в preview
          - name: macos-arm64
            os: macos-latest # Apple Silicon
            target: aarch64-apple-darwin
          - name: macos-x64
            os: macos-15-intel
            target: x86_64-apple-darwin
    runs-on: ${{ matrix.os }}
    continue-on-error: ${{ matrix.experimental == true }}
    steps:
      - uses: actions/checkout@v4

      - name: Linux deps (WebKitGTK и т.д.)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libsoup-3.0-dev \
            libjavascriptcoregtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf build-essential

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
          key: ${{ matrix.name }}

      - run: npm ci

      - name: Build (tauri)
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          args: ${{ matrix.target && format('--target {0}', matrix.target) || '' }}
          # только на тегах v*: черновик релиза с установщиками всех платформ
          tagName: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || '' }}
          releaseName: OpsDeck ${{ github.ref_name }}
          releaseBody: Сборки OpsDeck. macOS-сборки не подписаны — см. README.
          releaseDraft: true

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: opsdeck-${{ matrix.name }}
          if-no-files-found: error
          path: |
            src-tauri/target/release/bundle/deb/*.deb
            src-tauri/target/release/bundle/rpm/*.rpm
            src-tauri/target/release/bundle/appimage/*.AppImage
            src-tauri/target/release/bundle/msi/*.msi
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/*/release/bundle/dmg/*.dmg
            src-tauri/target/*/release/bundle/macos/
