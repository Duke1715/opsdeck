[package]
name = "opsdeck"
version = "0.1.0"
edition = "2021"

[lib]
name = "opsdeck_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
portable-pty = "0.9"
base64 = "0.22"
tokio = { version = "1", features = ["process", "io-util", "sync", "macros", "time"] }
kube = { version = "4.2", default-features = false, features = ["client", "rustls-tls", "ring", "http-proxy"] }
k8s-openapi = { version = "0.28", features = ["latest"] }
serde_yaml_ng = "0.10"
futures = "0.3"
chrono = "0.4"
dirs = "6"
keepass = "0.15"
tauri-plugin-clipboard-manager = "2"
zeroize = "1"
uuid = "1"
keyring = { version = "3", features = ["sync-secret-service", "crypto-rust", "vendored"] }
