[package]
name = "opsdeck"
version = "0.1.0"
edition = "2021"

[lib]
name = "opsdeck_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
portable-pty = "0.9"
base64 = "0.22"
tokio = { version = "1", features = ["process", "io-util", "sync", "macros"] }
dirs = "6"
keyring = { version = "3", features = ["sync-secret-service", "crypto-rust", "vendored"] }
