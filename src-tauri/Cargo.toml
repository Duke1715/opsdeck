[package]
name = "opsdeck"
version = "0.1.0"
edition = "2021"

[lib]
name = "opsdeck_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["unstable"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
portable-pty = "0.9"
base64 = "0.22"
tokio = { version = "1", features = ["process", "io-util", "sync", "macros", "time", "net"] }
kube = { version = "4.2", default-features = false, features = ["client", "rustls-tls", "ring", "http-proxy", "runtime"] }
k8s-openapi = { version = "0.28", features = ["latest"] }
serde_yaml_ng = "0.10"
futures = "0.3"
chrono = "0.4"
flate2 = "1"
axum = "0.8"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
tauri-plugin-notification = "2"
dirs = "6"
keepass = "0.15"
tauri-plugin-clipboard-manager = "2"
zeroize = "1"
uuid = { version = "1", features = ["v4"] }
tokio-tungstenite = "0.30"
keyring = { version = "3", features = ["sync-secret-service", "crypto-rust", "vendored"] }

[target.'cfg(target_os = "linux")'.dependencies]
# must match the versions tauri uses (embedded web panels reparent webviews in GTK)
gtk = "0.18"
webkit2gtk = "2.0"
